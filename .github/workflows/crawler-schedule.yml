name: Scheduled Crawler Update

on:
  schedule:
    # 매주 월요일 오전 9시 (한국시간 KST 기준) -> UTC 기준 매주 월요일 자정(0시 0분)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 크롤러 실행에 필요한 라이브러리 설치
          pip install curl_cffi supabase python-dotenv 

      - name: Run Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd code/7_advanced_recommender/scraper
          python crawler.py
