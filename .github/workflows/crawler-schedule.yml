name: Scheduled Crawler Update
on:
  schedule:
    - cron: '0 0 * * 1' # Monday 09:00 KST
  workflow_dispatch:
    inputs:
      product:
        description: 'Optional product ID; blank discovers the catalog'
        type: string
        default: ''
      max_review_pages:
        description: 'Pages per review sort (minimum 2)'
        type: number
        default: 100
      max_seconds:
        description: 'Crawl time budget in seconds'
        type: number
        default: 5400
permissions:
  contents: read
concurrency:
  group: cosmetics-pipeline
  cancel-in-progress: false
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: code/7_advanced_recommender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: code/7_advanced_recommender/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            code/7_advanced_recommender/.pipeline-cache/review-cursors.json
            code/7_advanced_recommender/.pipeline-cache/catalog-details.json
            code/7_advanced_recommender/.pipeline-cache/collection-history.json
          key: cosmetics-cursors-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cosmetics-cursors-v1-
      - name: Discover products, collect reviews, rebuild profiles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PRODUCT_ID: ${{ inputs.product || '' }}
          REVIEW_PAGES: ${{ inputs.max_review_pages || '100' }}
          CRAWL_SECONDS: ${{ inputs.max_seconds || '5400' }}
        run: |
          args=(--write --max-review-pages "$REVIEW_PAGES" --max-seconds "$CRAWL_SECONDS")
          if [[ -n "$PRODUCT_ID" ]]; then args+=(--product "$PRODUCT_ID"); fi
          python -u run_pipeline.py "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            code/7_advanced_recommender/.pipeline-cache/review-cursors.json
            code/7_advanced_recommender/.pipeline-cache/catalog-details.json
            code/7_advanced_recommender/.pipeline-cache/collection-history.json
          key: cosmetics-cursors-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-report
          path: code/7_advanced_recommender/.pipeline-cache/*report.json
          retention-days: 14
